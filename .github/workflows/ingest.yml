name: Hourly earthquake ingest

on:
  schedule:
    # Three attempts per hour, at :07, :27 and :47 (UTC).
    # Why not just once an hour: GitHub does not guarantee scheduled runs and
    # silently skips them when it is busy. With a single hourly slot, only 1 of
    # the first 11 scheduled runs actually started. Extra runs are harmless
    # because the ingest is idempotent (upsert on the quake id).
    # Never at :00, the busiest and most-delayed minute.
    - cron: "7,27,47 * * * *"
  # Adds a manual "Run workflow" button in the Actions tab, for testing.
  workflow_dispatch:

# Never run two ingests at once. If a run is still going when the next one
# is due, the new one waits instead of overlapping.
concurrency:
  group: ingest
  cancel-in-progress: false

# This job only reads the repo; it never needs to write to it.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a normal run takes about a minute; kill anything stuck
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip          # reuse downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest the past-day feed into MotherDuck
        env:
          # Comes from the repo's Actions secrets. Never written in this file.
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python ingest/ingest.py
